services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: turnoclaro
      MYSQL_USER: turnoclaro
      MYSQL_PASSWORD: turnoclaro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
